services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datastrom_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Required: without it the backend mints a random signing key per process
      # and every restart signs everyone out.
      - JWT_SECRET=${JWT_SECRET}
      # Resolved inside the Docker network, unlike the VITE_* vars below: this
      # is a server-to-server call, so the service name is correct here.
      - ML_SERVICE_URL=http://ml_service:8001
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      - ml_service
    restart: unless-stopped

  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: datastrom_ml_service
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    container_name: datastrom_frontend
    ports:
      - "5173:5173"
    environment:
      # Resolved in the browser, not inside the Docker network — must be
      # host-reachable URLs, not Docker service names.
      - VITE_BACKEND_URL=http://localhost:8000
      - VITE_ML_URL=http://localhost:8001
    volumes:
      - ./frontend/dashboard:/app
      - /app/node_modules
    depends_on:
      - backend
      - ml_service
    restart: unless-stopped
