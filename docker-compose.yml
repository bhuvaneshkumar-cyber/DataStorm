# Three services, all that the consolidated architecture needs:
#   frontend          - React/Vite dashboard
#   financial_backend - Python/FastAPI savings engine on Supabase PostgreSQL
#   ml_service        - Python/FastAPI credit scoring
services:
  financial_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gigsave_financial_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: gigsave_ml_service
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    container_name: gigsave_frontend
    ports:
      - "5173:5173"
    environment:
      # Resolved in the browser, not inside the container network - must be
      # host-reachable URLs, not Docker service names.
      - VITE_FINANCIAL_API_URL=http://localhost:8000
      - VITE_ML_API_URL=http://localhost:8001
      - VITE_DASHBOARD_USER_ID=${VITE_DASHBOARD_USER_ID}
    env_file:
      - .env
    volumes:
      - ./frontend/dashboard:/app
      - /app/node_modules
    depends_on:
      - financial_backend
      - ml_service
    restart: unless-stopped
